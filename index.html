<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn Korean with the 컴퓨터</title>
    <link rel="stylesheet" href="keompyuteo.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&display=swap");
    </style>
  </head>
  <body>
    <script type="module" src="keompyuteo_navbar.js"></script>
    <keompyuteo-nav-bar></keompyuteo-nav-bar>
    <div id="listening-game">
      <h2>Listen</h2>
      <div id="play-bar"></div>
      <p class="question">What did you hear?</p>
      <ol id="listen-options-list">
        <li>
          <label class="listen-guess-label"
            ><input type="radio" name="listen-guess" /><span
              class="guess"
            ></span
          ></label>
        </li>
        <li>
          <label class="listen-guess-label"
            ><input type="radio" name="listen-guess" /><span
              class="guess"
            ></span
          ></label>
        </li>
        <li>
          <label class="listen-guess-label"
            ><input type="radio" name="listen-guess" /><span
              class="guess"
            ></span
          ></label>
        </li>
        <li>
          <label class="listen-guess-label"
            ><input type="radio" name="listen-guess" /><span
              class="guess"
            ></span
          ></label>
        </li>
      </ol>
      <button id="new-listen-button" class="game-button">Next</button>
      <span class="score-box"
        >Score: <span class="num-correct">0</span> /
        <span class="num-total"></span
      ></span>
    </div>
    <script type="module" src="keompyuteo.js"></script>
  </body>
</html>
